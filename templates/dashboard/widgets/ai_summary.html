<div class="rounded-2xl border border-indigo-200 bg-gradient-to-r from-indigo-50 to-blue-50 shadow-sm"
     hx-get="{% url 'ai-summary-widget' %}" hx-trigger="load, every 60s" hx-swap="outerHTML">
    <div class="flex items-start gap-4 p-6">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white text-xl shrink-0">🤖</div>
        <div class="flex-1">
            <h3 class="font-semibold text-slate-800">AI Situation Summary</h3>
            <p class="mt-3 text-sm leading-7 text-slate-600">
                {{ summary|default:"Analysing current security situation across the South West region..." }}
            </p>
            {% if generated_at %}
            <p class="mt-3 text-xs text-slate-400">Updated {{ generated_at|timesince }} ago</p>
            {% endif %}
        </div>
    </div>
</div>
