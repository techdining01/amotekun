<div class="overflow-hidden rounded-2xl border border-indigo-200 bg-gradient-to-br from-indigo-50 to-slate-50 shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-indigo-100">
        <div class="flex items-center gap-2">
            <span class="text-lg">🤖</span>
            <h3 class="font-semibold text-slate-800">AI Cluster</h3>
        </div>
        <span class="flex items-center gap-1.5 rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            {{ cluster_status|default:"Healthy" }}
        </span>
    </div>
    <div class="p-6 grid grid-cols-2 gap-4">
        <div class="rounded-xl bg-white border border-slate-200 p-4 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ hotspot_count|default:0 }}</p>
            <p class="text-xs text-slate-500 mt-1">Active Hotspots</p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 p-4 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ prediction_accuracy|default:"—" }}</p>
            <p class="text-xs text-slate-500 mt-1">Prediction Accuracy</p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 p-4 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ models_loaded|default:0 }}</p>
            <p class="text-xs text-slate-500 mt-1">Models Loaded</p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 p-4 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ last_run|default:"—" }}</p>
            <p class="text-xs text-slate-500 mt-1">Last Analysis</p>
        </div>
    </div>
</div>
