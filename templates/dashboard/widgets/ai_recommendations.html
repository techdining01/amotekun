<div class="rounded-2xl border border-indigo-200 bg-gradient-to-r from-indigo-50 to-purple-50 p-4">
    <div class="flex items-start gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shrink-0">
            🤖
        </div>
        <div class="flex-1">
            <h3 class="text-base font-semibold">AI Recommendations</h3>
            <div class="mt-3 space-y-2">
                {% for recommendation in recommendations %}
                <div class="flex items-start gap-2 p-2.5 rounded-lg bg-white/50 border border-indigo-100">
                    <div class="mt-1 h-2 w-2 rounded-full bg-indigo-500 shrink-0"></div>
                    <div>
                        <div class="font-medium text-sm text-slate-800">{{ recommendation.title }}</div>
                        <div class="mt-0.5 text-xs text-slate-600">{{ recommendation.description }}</div>
                        <div class="mt-1">
                            <a href="{{ recommendation.action_url }}" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">
                                {{ recommendation.action_text }} →
                            </a>
                        </div>
                    </div>
                </div>
                {% empty %}
                <div class="text-center py-3 text-slate-500">
                    <p class="text-sm">No recommendations at this time</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
