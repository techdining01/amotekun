<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 class="font-semibold text-slate-800">Patrol Status</h3>
        <span class="text-xs text-slate-500">{{ active_count|default:0 }} active</span>
    </div>
    <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
        {% for team in patrol_teams %}
        <div class="flex items-center gap-4 px-5 py-3 hover:bg-slate-50 transition">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-50 text-blue-600 shrink-0">🛡</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-slate-800 truncate">{{ team.name }}</p>
                <p class="text-xs text-slate-500 mt-0.5">{{ team.team_type|title }}</p>
            </div>
            <span class="rounded-full px-2.5 py-1 text-xs font-semibold shrink-0
                {% if team.status == 'ON_PATROL' %}bg-green-100 text-green-700
                {% elif team.status == 'DISPATCHED' %}bg-blue-100 text-blue-700
                {% elif team.status == 'AVAILABLE' %}bg-emerald-100 text-emerald-700
                {% else %}bg-slate-100 text-slate-500{% endif %}">
                {{ team.status|title }}
            </span>
        </div>
        {% empty %}
        <div class="flex flex-col items-center justify-center py-10 text-center">
            <span class="text-3xl mb-3">🛡</span>
            <p class="text-sm text-slate-500">No patrol teams online.</p>
        </div>
        {% endfor %}
    </div>
</div>
