<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
     hx-get="{% url 'map-widget' %}"
     hx-trigger="load"
     hx-target="this">

    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/30">

        <div class="flex items-center gap-2">
            <span class="text-lg">🗺️</span>
            <h3 class="font-semibold text-slate-800">Operations Map</h3>
        </div>

        <span class="flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live
        </span>

    </div>

    <div class="h-[500px] w-full relative">

        {% include "cotton/maps/leaflet_map.html" with
            map_id="dashboard-map"
            height="500"
            tile="light"
            tile_layer="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
            attribution='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>' %}

    </div>

</div>
