<div class="overflow-hidden rounded-2xl border border-orange-200 bg-gradient-to-br from-orange-50 to-red-50 shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-orange-100">
        <div class="flex items-center gap-2">
            <span class="text-lg">🔥</span>
            <h3 class="font-semibold text-slate-800">National Hotspots</h3>
        </div>
        <span class="text-xs text-slate-500">Top {{ hotspots|length }}</span>
    </div>
    <div class="p-5 space-y-3">
        {% for hotspot in hotspots %}
        {% include "cotton/ai/ai_hotspot_card.html" %}
        {% empty %}
        <div class="flex flex-col items-center justify-center py-10 text-center">
            <span class="text-3xl mb-3">🗺</span>
            <p class="text-sm text-slate-500">No hotspot predictions available.</p>
        </div>
        {% endfor %}
    </div>
</div>
