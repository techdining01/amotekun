<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="px-4 py-3 border-b border-slate-100">
        <h3 class="font-semibold text-slate-800">Live Activity</h3>
    </div>
    <div class="divide-y divide-slate-100 max-h-[360px] overflow-y-auto">
        {% for activity in activities %}
        <div class="flex items-start gap-3 px-4 py-3 hover:bg-slate-50 transition">
            <span class="mt-1.5 h-2 w-2 rounded-full bg-blue-500 shrink-0"></span>
            <div class="flex-1 min-w-0">
                <p class="text-sm text-slate-800">{{ activity }}</p>
            </div>
        </div>
        {% empty %}
        <div class="flex flex-col items-center justify-center py-8 text-center">
            <p class="text-sm text-slate-500">No recent activity.</p>
        </div>
        {% endfor %}
    </div>
</div>
