{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amotekun - {{ role_display }} Dashboard</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Sound Alerts & Notifications -->
    <script src="{% static 'js/sound-alerts.js' %}"></script>
    <script src="{% static 'js/notifications.js' %}"></script>
</head>
<body class="bg-gray-50">
    <div x-data="{ sidebarOpen: false }" class="min-h-screen">
        <!-- Mobile sidebar backdrop -->
        <div x-show="sidebarOpen" x-transition:enter="transition-opacity ease-linear duration-300" 
             x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-linear duration-300"
             x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-gray-600 bg-opacity-75 z-40 lg:hidden"
             @click="sidebarOpen = false"></div>

        <!-- Sidebar -->
        <div x-show="sidebarOpen" 
             x-transition:enter="transition ease-in-out duration-300 transform"
             x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in-out duration-300 transform"
             x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
             class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg lg:static lg:inset-0 lg:translate-x-0">
            
            <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200">
                <span class="text-xl font-bold text-gray-800">Amotekun</span>
                <button @click="sidebarOpen = false" class="lg:hidden text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <nav class="mt-6 px-4">
                {% block sidebar %}
                {% endblock %}
            </nav>

            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-200">
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                        {{ user.username|first|upper }}
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-700">{{ user.username }}</p>
                        <p class="text-xs text-gray-500">{{ role_display }}</p>
                    </div>
                </div>
                <a href="{% url 'account_logout' %}" class="mt-3 block w-full text-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md">
                    Logout
                </a>
            </div>
        </div>

        <!-- Main content -->
        <div class="lg:pl-64">
            <!-- Top bar -->
            <div class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200">
                <button @click="sidebarOpen = true" class="lg:hidden text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-semibold text-gray-800">{{ role_display }} Dashboard</h1>
                <div class="flex items-center space-x-4">
                    <!-- Notification Bell -->
                    <div x-data="{ notificationOpen: false, unreadCount: 0 }" class="relative">
                        <button @click="notificationOpen = !notificationOpen" 
                                class="relative p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                            </svg>
                            <span x-show="unreadCount > 0" x-text="unreadCount" 
                                  class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-red-600 rounded-full"></span>
                        </button>
                        
                        <!-- Notification Panel -->
                        <div x-show="notificationOpen" @click.away="notificationOpen = false"
                             x-transition:enter="transition ease-out duration-200"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-150"
                             x-transition:leave-start="opacity-100 scale-100"
                             x-transition:leave-end="opacity-0 scale-95"
                             class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
                            <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                                <h3 class="font-semibold text-gray-800">Notifications</h3>
                                <button @click="notificationClient?.markAllAsRead(); unreadCount = 0" 
                                        class="text-sm text-blue-600 hover:text-blue-800">Mark all read</button>
                            </div>
                            <div id="notification-list" class="max-h-96 overflow-y-auto">
                                <div class="p-4 text-center text-gray-500 text-sm">No notifications</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Sound Toggle -->
                    <button @click="soundAlerts?.setEnabled(!soundAlerts?.enabled)" 
                            class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full"
                            title="Toggle Sound Alerts">
                        <svg x-show="soundAlerts?.enabled" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                        </svg>
                        <svg x-show="!soundAlerts?.enabled" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                        </svg>
                    </button>
                    
                    <span class="text-sm text-gray-600">{{ user.email }}</span>
                </div>
            </div>

            <!-- Page content -->
            <main class="p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    
    <!-- Notification Handling Script -->
    <script>
        // Initialize notification client
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof notificationClient !== 'undefined') {
                // Handle incoming notifications
                notificationClient.on('notification', function(notification) {
                    const notificationList = document.getElementById('notification-list');
                    if (notificationList) {
                        // Remove empty message if present
                        const emptyMsg = notificationList.querySelector('.text-center');
                        if (emptyMsg) emptyMsg.remove();
                        
                        // Add notification item
                        const item = document.createElement('div');
                        item.className = 'p-4 border-b border-gray-100 hover:bg-gray-50 cursor-pointer';
                        item.innerHTML = `
                            <div class="flex items-start">
                                <div class="flex-shrink-0">
                                    <div class="w-2 h-2 mt-2 rounded-full bg-blue-500"></div>
                                </div>
                                <div class="ml-3 flex-1">
                                    <p class="text-sm font-medium text-gray-800">${notification.title}</p>
                                    <p class="text-sm text-gray-600 mt-1">${notification.message}</p>
                                    <p class="text-xs text-gray-400 mt-1">${new Date(notification.created_at).toLocaleString()}</p>
                                </div>
                            </div>
                        `;
                        item.addEventListener('click', function() {
                            notificationClient.markAsRead(notification.id);
                            item.remove();
                        });
                        notificationList.insertBefore(item, notificationList.firstChild);
                    }
                });
                
                // Handle unread count updates
                notificationClient.on('unreadCount', function(count) {
                    const unreadBadge = document.querySelector('[x-text="unreadCount"]');
                    if (unreadBadge) {
                        unreadBadge.textContent = count;
                        unreadBadge.parentElement.style.display = count > 0 ? 'inline-flex' : 'none';
                    }
                });
                
                // Request initial unread count
                notificationClient.requestUnreadCount();
            }
        });
    </script>
</body>
</html>
