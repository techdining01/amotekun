{% load static %}
<!-- Camera Feed Viewer Component -->
<div x-data="{ 
    cameraOpen: false, 
    selectedCamera: null, 
    cameras: [],
    loading: false
}" x-init="loadCameras()" class="fixed bottom-4 left-4 z-50">
    <!-- Camera Toggle Button -->
    <button @click="cameraOpen = !cameraOpen" 
            class="flex items-center justify-center w-14 h-14 bg-green-600 text-white rounded-full shadow-lg hover:bg-green-700 transition-colors">
        <svg x-show="!cameraOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        <svg x-show="cameraOpen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    
    <!-- Camera Panel -->
    <div x-show="cameraOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-95 translate-y-4"
         class="absolute bottom-16 left-0 w-[500px] h-[400px] bg-white rounded-lg shadow-2xl border border-gray-200 flex flex-col">
        
        <!-- Camera Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
            <h3 class="font-semibold text-gray-800">CCTV Feeds</h3>
            <button @click="cameraOpen = false" class="text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Camera Body -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Camera List -->
            <div x-show="!selectedCamera" class="w-full p-4 overflow-y-auto">
                <div x-show="loading" class="text-center text-gray-500 text-sm">
                    Loading cameras...
                </div>
                <div x-show="!loading && cameras.length === 0" class="text-center text-gray-500 text-sm">
                    No cameras available. Add cameras via admin panel.
                </div>
                <div class="space-y-2">
                    <template x-for="camera in cameras" :key="camera.id">
                        <div @click="selectCamera(camera)" 
                             class="p-3 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors border border-gray-200">
                            <div class="flex items-center">
                                <div :class="camera.status === 'online' ? 'bg-green-500' : 'bg-red-500'" 
                                     class="w-3 h-3 rounded-full mr-3"></div>
                                <div class="flex-1">
                                    <p class="font-medium text-gray-800" x-text="camera.name"></p>
                                    <p class="text-xs text-gray-500" x-text="camera.camera_type + ' • ' + camera.status"></p>
                                    <p class="text-xs text-gray-400" x-text="camera.address || 'No address'"></p>
                                </div>
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M9 5l7 7-7 7"></path>
                                </svg>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Camera Feed View -->
            <div x-show="selectedCamera" class="w-full flex flex-col">
                <!-- Feed Header -->
                <div class="p-3 border-b border-gray-200 flex items-center justify-between">
                    <div class="flex items-center">
                        <button @click="selectedCamera = null" class="mr-2 text-gray-500 hover:text-gray-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <span class="font-medium text-gray-800" x-text="selectedCamera?.name"></span>
                    </div>
                    <div :class="selectedCamera?.status === 'online' ? 'text-green-600' : 'text-red-600'" 
                         class="text-xs font-medium" x-text="selectedCamera?.status?.toUpperCase()"></div>
                </div>
                
                <!-- Video Feed -->
                <div class="flex-1 bg-black flex items-center justify-center relative">
                    <template x-if="selectedCamera?.hls_url || selectedCamera?.rtsp_url">
                        <video id="camera-feed" 
                               class="w-full h-full object-contain"
                               controls
                               autoplay>
                            <source :src="selectedCamera?.hls_url" type="application/x-mpegURL">
                            <source :src="selectedCamera?.rtsp_url" type="application/x-rtsp">
                            Your browser does not support video playback.
                        </video>
                    </template>
                    <template x-if="!selectedCamera?.hls_url && !selectedCamera?.rtsp_url">
                        <div class="text-white text-center">
                            <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                            </svg>
                            <p class="text-sm">No stream configured</p>
                        </div>
                    </template>
                </div>
                
                <!-- Camera Info -->
                <div class="p-3 border-t border-gray-200 bg-gray-50">
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <span class="text-gray-500">Camera ID:</span>
                            <span class="text-gray-800 ml-1" x-text="selectedCamera?.camera_id"></span>
                        </div>
                        <div>
                            <span class="text-gray-500">Type:</span>
                            <span class="text-gray-800 ml-1" x-text="selectedCamera?.camera_type"></span>
                        </div>
                        <div>
                            <span class="text-gray-500">IP:</span>
                            <span class="text-gray-800 ml-1" x-text="selectedCamera?.ip_address || 'N/A'"></span>
                        </div>
                        <div>
                            <span class="text-gray-500">Coverage:</span>
                            <span class="text-gray-800 ml-1" x-text="selectedCamera?.coverage_radius + 'm'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function loadCameras() {
            this.loading = true;
            // Note: This endpoint needs to be created in surveillance app
            fetch('/api/surveillance/cameras/')
                .then(r => {
                    if (!r.ok) throw new Error('Camera API not available');
                    return r.json();
                })
                .then(data => {
                    this.cameras = data.results || data;
                })
                .catch(e => {
                    console.error('Failed to load cameras:', e);
                    this.cameras = [];
                })
                .finally(() => {
                    this.loading = false;
                });
        }
        
        function selectCamera(camera) {
            this.selectedCamera = camera;
        }
    </script>
</div>
