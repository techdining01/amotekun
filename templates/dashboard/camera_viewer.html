{% load static %}
<div x-data="cameraViewer()" x-init="loadCameras()" class="fixed bottom-4 left-4 z-50">
    <button @click="cameraOpen = !cameraOpen" 
            class="flex items-center justify-center w-14 h-14 bg-green-600 text-white rounded-full shadow-lg hover:bg-green-700 transition-colors">
        <svg x-show="!cameraOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        <svg x-show="cameraOpen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>

    <div x-show="cameraOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-95 translate-y-4"
         class="absolute bottom-16 left-0 w-[560px] h-[520px] bg-white rounded-lg shadow-2xl border border-gray-200 flex flex-col">

        <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
            <h3 class="font-semibold text-gray-800">CCTV Feeds</h3>
            <button @click="cameraOpen = false" class="text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="flex-1 flex overflow-hidden">
            <div class="w-[320px] border-r border-gray-200 bg-white flex flex-col">
                <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-semibold text-gray-800">Camera Batches</h4>
                        <p class="text-xs text-gray-500">Showing {{ pageSize }} per batch</p>
                    </div>
                    <button @click="showRegister = !showRegister"
                            class="inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-green-500 text-green-600 bg-green-50 hover:bg-green-100 text-xs font-medium">
                        <span x-text="showRegister ? 'Browse cameras' : 'Register current'"></span>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-4">
                    <template x-if="showRegister">
                        <div class="space-y-4">
                            <div class="text-sm text-gray-600">Register the current device using the configured CAMERA_DEVICE_ID.</div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">Name</label>
                                <input x-model="registerForm.name" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="V380 Camera">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">Description</label>
                                <input x-model="registerForm.description" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="PTZ camera on gate">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-2">
                                    <label class="block text-xs font-semibold text-gray-700">IP Address</label>
                                    <input x-model="registerForm.ip_address" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="192.168.1.50">
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-xs font-semibold text-gray-700">Port</label>
                                    <input x-model="registerForm.port" type="number" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="80">
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">RTSP URL</label>
                                <input x-model="registerForm.rtsp_url" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="rtsp://...">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">HLS URL</label>
                                <input x-model="registerForm.hls_url" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="https://...">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-semibold text-gray-700">Control URL</label>
                                <input x-model="registerForm.control_url" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="http://.../ptz">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-2">
                                    <label class="block text-xs font-semibold text-gray-700">Username</label>
                                    <input x-model="registerForm.username" type="text" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="admin">
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-xs font-semibold text-gray-700">Password</label>
                                    <input x-model="registerForm.password" type="password" class="w-full rounded-lg border-gray-300 shadow-sm" placeholder="••••••••">
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="registerCurrentCamera()" type="button" class="px-4 py-2 rounded-lg bg-green-600 text-white text-sm hover:bg-green-700">Register Device</button>
                                <span x-show="registerMessage" class="text-sm text-blue-600" x-text="registerMessage"></span>
                            </div>
                        </div>
                    </template>

                    <template x-if="!showRegister">
                        <div>
                            <div x-show="loading" class="text-center text-gray-500 text-sm">
                                Loading cameras...
                            </div>
                            <div x-show="!loading && cameras.length === 0" class="text-center text-gray-500 text-sm">
                                No cameras available. Add cameras via the surveillance admin or API.
                            </div>

                            <div x-show="!loading && cameras.length > 0" class="space-y-3">
                                <template x-for="camera in cameras" :key="camera.id">
                                    <button @click="selectCamera(camera)"
                                            type="button"
                                            class="w-full text-left p-3 rounded-xl border border-gray-200 hover:border-green-500 hover:bg-green-50 transition-colors focus:outline-none focus:ring-2 focus:ring-green-300">
                                        <div class="flex items-center justify-between gap-3">
                                            <div class="flex items-start gap-3">
                                                <div :class="camera.is_online ? 'bg-green-500' : 'bg-red-500'"
                                                     class="w-3 h-3 rounded-full mt-1"></div>
                                                <div class="flex-1">
                                                    <div class="font-medium text-gray-800" x-text="camera.name"></div>
                                                    <div class="text-xs text-gray-500" x-text="camera.camera_type + ' • ' + camera.status"></div>
                                                    <div class="text-xs text-gray-400 truncate" x-text="camera.address || camera.ip_address || 'No address / IP'"></div>
                                                </div>
                                            </div>
                                            <div class="text-xs text-gray-500" x-text="camera.is_online ? 'Live' : 'Offline'"></div>
                                        </div>
                                    </button>
                                </template>
                            </div>

                            <div x-show="!loading && cameras.length > 0" class="mt-4 flex items-center justify-between text-xs text-gray-600">
                                <button @click="prevPage()" :disabled="!previous"
                                        class="px-3 py-2 rounded-md border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Previous
                                </button>
                                <div>
                                    Batch <span x-text="page"></span> of <span x-text="totalPages"></span>
                                </div>
                                <button @click="nextPage()" :disabled="!next"
                                        class="px-3 py-2 rounded-md border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Next
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="flex-1 flex flex-col bg-gray-950 text-white">
                <div class="p-4 border-b border-white/10 flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-semibold" x-text="selectedCamera ? selectedCamera.name : 'Select a camera to preview'"></h4>
                        <p class="text-xs text-gray-300" x-text="selectedCamera ? selectedCamera.camera_type + ' • ' + selectedCamera.status : 'Choose one of the 8 cameras in this batch.'"></p>
                    </div>
                    <button x-show="selectedCamera" @click="selectedCamera = null"
                            class="text-gray-300 hover:text-white text-xs font-medium">Clear</button>
                </div>

                <div class="flex-1 bg-black flex items-center justify-center relative">
                    <template x-if="selectedCamera?.stream_url">
                        <video id="camera-feed"
                               class="w-full h-full object-contain"
                               controls
                               autoplay>
                            <source :src="selectedCamera?.stream_url" type="application/x-mpegURL">
                            <source :src="selectedCamera?.stream_url" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                    </template>
                    <template x-if="selectedCamera && !selectedCamera?.stream_url">
                        <div class="text-white text-center px-4">
                            <p class="text-sm">Selected camera has no stream URL configured.</p>
                        </div>
                    </template>
                    <template x-if="!selectedCamera">
                        <div class="text-center px-4">
                            <p class="text-white/70 text-sm">Pick one of the eight visible cameras to open its live preview.</p>
                        </div>
                    </template>
                </div>

                <template x-if="selectedCamera">
                    <div class="p-4 bg-gray-900 text-sm text-gray-200">
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <div class="text-gray-400">Camera ID</div>
                                <div class="text-white" x-text="selectedCamera.camera_id"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">Stream URL</div>
                                <div class="text-white truncate" x-text="selectedCamera.stream_url || 'None'"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">PTZ Control</div>
                                <div class="text-white truncate" x-text="selectedCamera.control_url || 'Not configured'"></div>
                            </div>
                            <div>
                                <div class="text-gray-400">Coverage</div>
                                <div class="text-white" x-text="selectedCamera.coverage_radius + ' m'"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2 mb-3">
                            <button @click="ptzCommand('left')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Left</button>
                            <button @click="ptzCommand('up')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Up</button>
                            <button @click="ptzCommand('right')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Right</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button @click="ptzCommand('zoom_in')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Zoom In</button>
                            <button @click="ptzCommand('home')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Home</button>
                            <button @click="ptzCommand('zoom_out')" type="button" class="px-3 py-2 rounded-md bg-white/10 hover:bg-white/15 text-sm">Zoom Out</button>
                        </div>
                        <div x-show="ptzMessage" class="mt-3 text-xs text-blue-300" x-text="ptzMessage"></div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function cameraViewer() {
            return {
                cameraOpen: false,
                selectedCamera: null,
                cameras: [],
                loading: false,
                page: 1,
                pageSize: 8,
                totalPages: 1,
                next: null,
                previous: null,
                showRegister: false,
                registerMessage: null,
                registerForm: {
                    name: 'V380 Camera',
                    description: 'V380 wireless PTZ camera',
                    camera_type: 'ptz',
                    ip_address: '',
                    port: 80,
                    rtsp_url: '',
                    hls_url: '',
                    control_url: '',
                    username: '',
                    password: '',
                },

                loadCameras(url) {
                    this.loading = true;
                    const fetchUrl = url || `/api/surveillance/cameras/?page=${this.page}&page_size=${this.pageSize}`;
                    fetch(fetchUrl)
                        .then(r => {
                            if (!r.ok) throw new Error('Camera API not available');
                            return r.json();
                        })
                        .then(data => {
                            this.cameras = data.results || data;
                            this.next = data.next;
                            this.previous = data.previous;
                            this.totalPages = data.count ? Math.ceil(data.count / this.pageSize) : 1;
                        })
                        .catch(e => {
                            console.error('Failed to load cameras:', e);
                            this.cameras = [];
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                },

                selectCamera(camera) {
                    this.selectedCamera = camera;
                },

                prevPage() {
                    if (!this.previous) return;
                    this.page = Math.max(1, this.page - 1);
                    this.loadCameras(this.previous);
                },

                nextPage() {
                    if (!this.next) return;
                    this.page = Math.min(this.totalPages, this.page + 1);
                    this.loadCameras(this.next);
                },

                registerCurrentCamera() {
                    this.registerMessage = 'Registering...';
                    fetch('/api/surveillance/cameras/register-current/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1],
                        },
                        body: JSON.stringify(this.registerForm),
                    })
                        .then((r) => r.json().then((data) => ({ status: r.status, body: data })))
                        .then(({ status, body }) => {
                            if (status >= 200 && status < 300) {
                                this.registerMessage = 'Device registered successfully.';
                                this.showRegister = false;
                                this.loadCameras();
                            } else {
                                this.registerMessage = body.detail || 'Registration failed.';
                            }
                        })
                        .catch((error) => {
                            console.error('Register current camera failed', error);
                            this.registerMessage = 'Registration request failed.';
                        });
                },

                ptzCommand(action) {
                    if (!this.selectedCamera || !this.selectedCamera.control_url) {
                        this.ptzMessage = 'PTZ control is not configured for this camera.';
                        return;
                    }

                    fetch(`/api/surveillance/cameras/${this.selectedCamera.id}/ptz/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1],
                        },
                        body: JSON.stringify({
                            action,
                            speed: 1,
                        }),
                    })
                        .then((r) => r.json())
                        .then((data) => {
                            this.ptzMessage = data.detail || data.status || 'Command sent';
                        })
                        .catch((error) => {
                            this.ptzMessage = 'Failed to send PTZ command.';
                            console.error(error);
                        });
                },

                ptzMessage: null,
            };
        }
    </script>
</div>
