{% load static %}
<!-- Chat Component -->
<div x-data="{ 
    chatOpen: false, 
    selectedRoom: null, 
    rooms: [], 
    messages: [],
    messageInput: ''
}" x-init="loadChatRooms()" class="fixed bottom-4 right-4 z-50">
    <!-- Chat Toggle Button -->
    <button @click="chatOpen = !chatOpen" 
            class="flex items-center justify-center w-14 h-14 bg-blue-600 text-white rounded-full shadow-lg hover:bg-blue-700 transition-colors">
        <svg x-show="!chatOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <svg x-show="chatOpen" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    
    <!-- Chat Panel -->
    <div x-show="chatOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-95 translate-y-4"
         class="absolute bottom-16 right-0 w-96 h-[500px] bg-white rounded-lg shadow-2xl border border-gray-200 flex flex-col">
        
        <!-- Chat Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50 rounded-t-lg">
            <h3 class="font-semibold text-gray-800">Operative Chat</h3>
            <button @click="chatOpen = false" class="text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Chat Body -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Room List -->
            <div x-show="!selectedRoom" class="w-full p-4 overflow-y-auto">
                <div class="mb-4">
                    <button @click="createRoom()" 
                            class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        + New Room
                    </button>
                </div>
                <div x-show="rooms.length === 0" class="text-center text-gray-500 text-sm">
                    No chat rooms. Create one to start chatting.
                </div>
                <div class="space-y-2">
                    <template x-for="room in rooms" :key="room.id">
                        <div @click="selectRoom(room)" 
                             class="p-3 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors">
                            <div class="flex items-center">
                                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                                    <span x-text="room.name.charAt(0).toUpperCase()"></span>
                                </div>
                                <div class="ml-3 flex-1">
                                    <p class="font-medium text-gray-800" x-text="room.name"></p>
                                    <p class="text-xs text-gray-500" x-text="room.room_type"></p>
                                </div>
                                <div x-show="room.message_count > 0" 
                                     class="text-xs text-gray-400" x-text="room.message_count + ' msgs'"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            
            <!-- Messages View -->
            <div x-show="selectedRoom" class="w-full flex flex-col">
                <!-- Room Header -->
                <div class="p-3 border-b border-gray-200 flex items-center">
                    <button @click="selectedRoom = null" class="mr-2 text-gray-500 hover:text-gray-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <span class="font-medium text-gray-800" x-text="selectedRoom?.name"></span>
                </div>
                
                <!-- Messages -->
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3">
                    <template x-for="message in messages" :key="message.id">
                        <div :class="message.is_own ? 'flex justify-end' : 'flex justify-start'">
                            <div :class="message.is_own ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-800'" 
                                 class="max-w-[80%] rounded-lg px-4 py-2">
                                <p class="text-xs font-medium mb-1" x-text="message.sender_name"></p>
                                <p class="text-sm" x-text="message.content"></p>
                                <p class="text-xs mt-1 opacity-70" x-text="formatTime(message.created_at)"></p>
                            </div>
                        </div>
                    </template>
                    <div x-show="messages.length === 0" class="text-center text-gray-500 text-sm">
                        No messages yet. Start the conversation!
                    </div>
                </div>
                
                <!-- Message Input -->
                <div class="p-4 border-t border-gray-200">
                    <div class="flex space-x-2">
                        <input x-model="messageInput" 
                               @keydown.enter="sendMessage()"
                               type="text" 
                               placeholder="Type a message..." 
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button @click="sendMessage()" 
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function loadChatRooms() {
            fetch('/api/chat/rooms/')
                .then(r => r.json())
                .then(data => {
                    this.rooms = data.results || data;
                })
                .catch(e => console.error('Failed to load chat rooms:', e));
        }
        
        function selectRoom(room) {
            this.selectedRoom = room;
            fetch(`/api/chat/rooms/${room.id}/messages/`)
                .then(r => r.json())
                .then(data => {
                    this.messages = (data.results || data).map(m => ({
                        ...m,
                        is_own: m.sender_name === '{{ user.username }}'
                    }));
                })
                .catch(e => console.error('Failed to load messages:', e));
        }
        
        function sendMessage() {
            if (!this.messageInput.trim() || !this.selectedRoom) return;
            
            fetch('/api/chat/messages/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({
                    room: this.selectedRoom.id,
                    content: this.messageInput
                })
            })
            .then(r => r.json())
            .then(data => {
                this.messages.push({
                    ...data,
                    is_own: true
                });
                this.messageInput = '';
                // Play chat sound
                if (typeof soundAlerts !== 'undefined') {
                    soundAlerts.playChat();
                }
            })
            .catch(e => console.error('Failed to send message:', e));
        }
        
        function createRoom() {
            const name = prompt('Enter room name:');
            if (!name) return;
            
            fetch('/api/chat/rooms/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({
                    name: name,
                    room_type: 'general'
                })
            })
            .then(r => r.json())
            .then(data => {
                this.rooms.push(data);
            })
            .catch(e => console.error('Failed to create room:', e));
        }
        
        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                   document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
        }
    </script>
</div>
