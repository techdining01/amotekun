<div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">

    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">

        <h3 class="font-semibold text-slate-800">Team Chat</h3>

        <span class="flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Connected
        </span>

    </div>

    <div class="flex h-[400px]">

        <div class="flex-1 flex flex-col">

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">

                {% for message in messages %}

                <div class="flex {% if message.sender == user %}justify-end{% else %}justify-start{% endif %}">

                    <div class="max-w-[75%] rounded-2xl px-4 py-2.5
                        {% if message.sender == user %}bg-blue-600 text-white rounded-br-md{% else %}bg-slate-100 text-slate-800 rounded-bl-md{% endif %}">

                        {% if message.sender != user %}

                        <p class="text-xs font-semibold text-slate-500 mb-1">{{ message.sender.username }}</p>

                        {% endif %}

                        <p class="text-sm">{{ message.content }}</p>

                        <p class="text-xs mt-1 opacity-70 {% if message.sender == user %}text-right{% endif %}">{{ message.timestamp|timesince }} ago</p>

                    </div>

                </div>

                {% empty %}

                <div class="flex flex-col items-center justify-center h-full text-center text-slate-400">

                    <svg class="w-12 h-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>

                    <p class="text-sm">No messages yet. Start a conversation!</p>

                </div>

                {% endfor %}

            </div>

            <div class="p-4 border-t border-slate-100">

                <form hx-post="{% url 'chat-send' %}" hx-target="#chat-messages" hx-swap="beforeend" class="flex gap-2">

                    <input type="text"
                           name="message"
                           placeholder="Type a message..."
                           class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                           autocomplete="off">

                    <button type="submit"
                            class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">
                        Send
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
