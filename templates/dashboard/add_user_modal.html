<div x-data="{ show: true }" x-show="show" x-cloak class="fixed inset-0 z-[1100] overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" @click="show = false; setTimeout(() => document.getElementById('modal-root').innerHTML = '', 300);"></div>
        <div class="relative inline-block bg-white rounded-2xl text-left overflow-hidden shadow-2xl shadow-slate-900/20 transition-all w-full sm:max-w-lg">
            <div class="px-6 pt-6 pb-4">
                <div class="flex items-start justify-between">
                    <h2 class="text-xl font-semibold text-slate-800" id="modal-title">Add New User</h2>
                    <button type="button" class="ml-2 flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition" @click="show = false; setTimeout(() => document.getElementById('modal-root').innerHTML = '', 300);">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="border-t border-slate-100 pb-6 px-6">
                <form method="post" hx-post="{% url 'add-user' %}" hx-target="#modal-root" hx-swap="innerHTML" class="space-y-4">
                    {% csrf_token %}
                    {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            {% for error in field.errors %}
                                <p class="text-sm text-red-500 mt-1">{{ error }}</p>
                            {% endfor %}
                        {% endif %}
                    </div>
                    {% endfor %}
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" @click="show = false; setTimeout(() => document.getElementById('modal-root').innerHTML = '', 300);" class="rounded-lg border border-slate-200 px-5 py-2 hover:bg-slate-50 transition">Cancel</button>
                        <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700 transition">Add User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
