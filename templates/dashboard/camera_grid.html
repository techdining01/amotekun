{% extends "dashboard/base_dashboard.html" %}

{% block sidebar %}
<a href="{% url 'dispatcher-dashboard' %}" class="flex items-center px-4 py-3 text-gray-700 bg-blue-50 rounded-lg mb-2">
    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
    </svg>
    Back to Dashboard
</a>
{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <h2 class="text-2xl font-semibold text-gray-900">Camera Grid</h2>
        <p class="text-sm text-gray-500">Toggle between 8-camera batch layout and 24-camera grid preview.</p>
    </div>
    <div class="flex items-center gap-3">
        <button @click="layout = 'batch'" class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">8-camera batches</button>
        <button @click="layout = 'grid'" class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50">24-camera grid</button>
    </div>
</div>

<div x-data="cameraGridPage()" x-init="loadCameras()" class="space-y-6">
    <div x-show="layout === 'batch'">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
            <template x-for="camera in cameras" :key="camera.id">
                <button @click="selectCamera(camera)" type="button" class="group relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-4 text-left shadow-sm hover:border-green-500 hover:shadow-md transition">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-base font-semibold text-gray-900" x-text="camera.name"></h3>
                            <p class="text-xs text-gray-500" x-text="camera.camera_type + ' • ' + camera.status"></p>
                        </div>
                        <div :class="camera.is_online ? 'bg-green-500' : 'bg-red-500'" class="h-3 w-3 rounded-full"></div>
                    </div>
                    <div class="mt-3 text-sm text-gray-600 truncate" x-text="camera.address || camera.ip_address || 'No location or IP configured'"></div>
                </button>
            </template>
        </div>

        <div class="mt-6 flex items-center justify-between text-sm text-gray-600">
            <button @click="prevPage()" :disabled="!previous" class="px-4 py-2 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
            <div>Batch <span x-text="page"></span> of <span x-text="totalPages"></span></div>
            <button @click="nextPage()" :disabled="!next" class="px-4 py-2 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
        </div>
    </div>

    <div x-show="layout === 'grid'">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <template x-for="camera in allCameras" :key="camera.id">
                <div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
                    <div class="p-4">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <h3 class="text-sm font-semibold text-gray-900" x-text="camera.name"></h3>
                                <p class="text-xs text-gray-500" x-text="camera.camera_type + ' • ' + camera.status"></p>
                            </div>
                            <span :class="camera.is_online ? 'bg-green-500' : 'bg-red-500'" class="h-2.5 w-2.5 rounded-full"></span>
                        </div>
                        <p class="mt-3 text-xs text-gray-500 truncate" x-text="camera.address || camera.ip_address || 'No address or IP'"></p>
                    </div>
                    <div class="bg-gray-950 h-40 flex items-center justify-center">
                        <template x-if="camera.stream_url">
                            <video class="h-full w-full object-cover" :src="camera.stream_url" muted autoplay playsinline></video>
                        </template>
                        <template x-if="!camera.stream_url">
                            <div class="text-center text-xs text-gray-400 px-4">
                                No stream configured for this camera.
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div x-show="selectedCamera" class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm">
        <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div>
                <h3 class="text-lg font-semibold text-gray-900" x-text="selectedCamera.name"></h3>
                <p class="text-sm text-gray-500" x-text="selectedCamera.camera_type + ' • ' + selectedCamera.status"></p>
            </div>
            <button @click="selectedCamera = null" class="text-sm text-blue-600 hover:text-blue-700">Clear preview</button>
        </div>

        <div class="mt-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 bg-black flex items-center justify-center rounded-3xl overflow-hidden">
                <template x-if="selectedCamera.stream_url">
                    <video class="w-full h-full object-contain" :src="selectedCamera.stream_url" controls autoplay></video>
                </template>
                <template x-if="!selectedCamera.stream_url">
                    <div class="text-center text-gray-400 p-6">
                        No stream URL configured for this camera.
                    </div>
                </template>
            </div>
            <div class="space-y-4">
                <div class="rounded-3xl border border-gray-200 bg-gray-50 p-4">
                    <div class="text-xs text-gray-500">Camera Details</div>
                    <div class="mt-3 space-y-2 text-sm text-gray-700">
                        <div><span class="font-medium">ID:</span> <span x-text="selectedCamera.camera_id"></span></div>
                        <div><span class="font-medium">Stream URL:</span> <span x-text="selectedCamera.stream_url || 'None'"></span></div>
                        <div><span class="font-medium">PTZ Control:</span> <span x-text="selectedCamera.control_url || 'Not configured'"></span></div>
                        <div><span class="font-medium">Coverage:</span> <span x-text="selectedCamera.coverage_radius + ' m'"></span></div>
                    </div>
                </div>
                <div class="rounded-3xl border border-gray-200 bg-gray-50 p-4">
                    <div class="text-xs text-gray-500">PTZ Controls</div>
                    <div class="mt-3 grid grid-cols-3 gap-2">
                        <button @click="ptzCommand('left')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Left</button>
                        <button @click="ptzCommand('up')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Up</button>
                        <button @click="ptzCommand('right')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Right</button>
                        <button @click="ptzCommand('zoom_in')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Zoom In</button>
                        <button @click="ptzCommand('home')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Home</button>
                        <button @click="ptzCommand('zoom_out')" class="rounded-xl bg-white px-3 py-2 text-sm text-gray-700 hover:bg-gray-100">Zoom Out</button>
                    </div>
                    <div x-show="ptzMessage" class="mt-3 text-xs text-blue-600" x-text="ptzMessage"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function cameraGridPage() {
        return {
            layout: 'batch',
            cameras: [],
            allCameras: [],
            selectedCamera: null,
            loading: false,
            page: 1,
            pageSize: 8,
            totalPages: 1,
            next: null,
            previous: null,
            ptzMessage: null,

            loadCameras(url) {
                this.loading = true;
                const fetchUrl = url || `/api/surveillance/cameras/?page=${this.page}&page_size=${this.pageSize}`;
                fetch(fetchUrl)
                    .then(r => {
                        if (!r.ok) throw new Error('Failed to fetch cameras');
                        return r.json();
                    })
                    .then(data => {
                        this.cameras = data.results || data;
                        this.next = data.next;
                        this.previous = data.previous;
                        this.totalPages = data.count ? Math.ceil(data.count / this.pageSize) : 1;
                        this.page = data.page || this.page;
                    })
                    .catch(error => {
                        console.error(error);
                        this.cameras = [];
                    })
                    .finally(() => {
                        this.loading = false;
                    });

                // Fetch all cameras for the 24-camera grid separately
                fetch('/api/surveillance/cameras/?page_size=24')
                    .then(r => r.json())
                    .then(data => {
                        this.allCameras = data.results || data;
                    })
                    .catch(() => {
                        this.allCameras = [];
                    });
            },

            selectCamera(camera) {
                this.selectedCamera = camera;
                if (this.layout === 'grid') {
                    this.layout = 'grid';
                }
            },

            prevPage() {
                if (!this.previous) return;
                this.page = Math.max(1, this.page - 1);
                this.loadCameras(this.previous);
            },

            nextPage() {
                if (!this.next) return;
                this.page = Math.min(this.totalPages, this.page + 1);
                this.loadCameras(this.next);
            },

            ptzCommand(action) {
                if (!this.selectedCamera || !this.selectedCamera.control_url) {
                    this.ptzMessage = 'PTZ control is not configured for this camera.';
                    return;
                }
                fetch(`/api/surveillance/cameras/${this.selectedCamera.id}/ptz/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1],
                    },
                    body: JSON.stringify({ action, speed: 1 }),
                })
                    .then(r => r.json())
                    .then(data => {
                        this.ptzMessage = data.detail || data.status || 'Command sent';
                    })
                    .catch(error => {
                        console.error(error);
                        this.ptzMessage = 'Failed to send PTZ command.';
                    });
            },
        };
    }
</script>
{% endblock %}
