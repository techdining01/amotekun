{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amotekun Network</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <!-- Tailwind CSS output file -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="relative">
    <div id="map"></div>

    <div id="incidents-list" class="hidden"></div>
    <div id="dispatches-list" class="hidden"></div>

    <!-- Add Incident Button -->
    <div x-data class="fixed bottom-8 right-8 z-[1000] flex flex-col gap-2">
        <button @click="$store.dispatchModal.open()" type="button" class="bg-green-600 hover:bg-green-700 text-white w-14 h-14 rounded-full shadow-lg transition-colors flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
            </svg>
        </button>
        <button @click="$store.incidentModal.open()" type="button" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg transition-colors flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <!-- Incident Modal -->
    <div x-show="$store.incidentModal.isOpen" x-cloak class="fixed inset-0 z-[1100] overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen px-4 py-8 text-center sm:block sm:p-0">
            <div x-show="$store.incidentModal.isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="$store.incidentModal.close()"></div>

            <div x-show="$store.incidentModal.isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form hx-post="{% url 'incident-create' %}" hx-target="#incidents-list" hx-swap="innerHTML" class="p-6">
                    {% csrf_token %}
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Report New Incident</h3>
                    <div class="mb-4">
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                        <input type="text" name="title" id="title" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea name="description" id="description" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="report_type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                        <select name="report_type" id="report_type" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="crime">Crime</option>
                            <option value="violence">Violence</option>
                            <option value="fire">Fire</option>
                            <option value="flood">Flood</option>
                            <option value="accident">Accident</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="latitude" class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                        <input type="number" step="any" name="latitude" id="latitude" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-50">
                    </div>
                    <div class="mb-4">
                        <label for="longitude" class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                        <input type="number" step="any" name="longitude" id="longitude" readonly class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-50">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" @click="$store.incidentModal.close()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md">Save Incident</button>
                    </div>
                </form>
            </div>
        </div>
</div>

    <!-- Dispatch Modal -->
    <div x-show="$store.dispatchModal.isOpen" x-cloak class="fixed inset-0 z-[1100] overflow-y-auto" aria-labelledby="dispatch-modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen px-4 py-8 text-center sm:block sm:p-0">
            <div x-show="$store.dispatchModal.isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="$store.dispatchModal.close()"></div>

            <div x-show="$store.dispatchModal.isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <form id="dispatch-form" hx-post="/api/dispatch/dispatches/" hx-target="#dispatches-list" hx-swap="innerHTML" class="p-6">
                    {% csrf_token %}
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Create Dispatch</h3>
                    <div class="mb-4">
                        <label for="dispatch-incident" class="block text-sm font-medium text-gray-700 mb-1">Incident</label>
                        <select name="incident" id="dispatch-incident" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="dispatch-police" class="block text-sm font-medium text-gray-700 mb-1">Police Station</label>
                        <select name="police_station" id="dispatch-police" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">None</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="dispatch-amotekun" class="block text-sm font-medium text-gray-700 mb-1">Amotekun Station</label>
                        <select name="amotekun_station" id="dispatch-amotekun" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">None</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="dispatch-status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select name="status" id="dispatch-status" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="pending">Pending</option>
                            <option value="dispatched">Dispatched</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="dispatch-notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                        <textarea name="notes" id="dispatch-notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" @click="$store.dispatchModal.close()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-md">Create Dispatch</button>
                    </div>
                </form>
            </div>
        </div>
</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <!-- Heatmap JS -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <!-- Turf.js for robust point-in-polygon checks -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Modular JavaScript -->
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/map.js' %}"></script>
    <script src="{% static 'js/data-loader.js' %}"></script>
    <script src="{% static 'js/modals.js' %}"></script>
    <script src="{% static 'js/dropdowns.js' %}"></script>
    <script src="{% static 'js/ui-components.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
