{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amotekun Network</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
         integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
         crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="relative">
    <div id="map"></div>
    
    <div id="incidents-list" class="hidden"></div>
    <div id="dispatches-list" class="hidden"></div>

    <div id="action-buttons" style="position: fixed; bottom: 32px; right: 32px; z-index: 9999; display: flex; flex-direction: column; gap: 8px;">
        <button id="dispatch-btn" type="button" style="background: #16a34a; color: white; width: 56px; height: 56px; border-radius: 50%; border: 2px solid white; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-size: 9px;">
            Dispatch
        </button>
        <button id="incident-btn" type="button" style="background: #2563eb; color: white; width: 56px; height: 56px; border-radius: 50%; border: 2px solid white; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-size: 9px;">
            Report
        </button>
    </div>

    <!-- Login link for role-based access -->
    <div style="position: fixed; top: 16px; left: 40px; z-index: 9999;">
        {% if user.is_authenticated %}
            <a href="{% url 'home' %}" style="padding: 8px 12px; background: rgba(255,255,255,0.9); border-radius: 6px; text-decoration: none; font-size: 14px; color: #374151;">{{ user.username }} ({{ user.get_role_display }})</a>
            <a href="{% url 'account_logout' %}" style="padding: 8px 12px; background: rgba(255,255,255,0.9); border-radius: 6px; text-decoration: none; font-size: 14px; color: #dc2626; margin-left: 8px;">Logout</a>
        {% else %}
            <a href="{% url 'account_login' %}" style="padding: 8px 12px; background: rgba(255,255,255,0.9); border-radius: 6px; text-decoration: none; font-size: 14px; color: #2563eb;">Login</a>
        {% endif %}
    </div>

    <!-- Incident Sidebar (docked) -->
    <div id="incident-sidebar" style="display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 380px; z-index: 9998; background: white; box-shadow: -4px 0 6px -1px rgba(0,0,0,0.1); overflow-y: auto;">
        <div style="padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 18px; font-weight: 600; color: #111827;">Report New Incident</h2>
            <button type="button" onclick="document.getElementById('incident-sidebar').style.display='none'" style="padding: 4px;">
                <svg style="width: 20px; height: 20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div style="padding: 20px;">
            <form hx-post="{% url 'incident-create' %}" hx-target="#incidents-list" hx-swap="innerHTML">
                {% csrf_token %}
                <div style="margin-bottom: 14px;">
                    <label for="title" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Title</label>
                    <input type="text" name="title" id="title" required style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="description" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Description</label>
                    <textarea name="description" id="description" rows="2" required style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; resize: vertical;"></textarea>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="report_type" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Type</label>
                    <select name="report_type" id="report_type" required style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                        <option value="crime">Crime</option>
                        <option value="violence">Violence</option>
                        <option value="fire">Fire</option>
                        <option value="flood">Flood</option>
                        <option value="accident">Accident</option>
                    </select>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="location-search" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Location</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" name="location_search" id="location_search" placeholder="Enter address..." style="flex: 1; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                        <button type="button" id="geocode-btn" style="padding: 0 12px; background: #6b7280; color: white; border-radius: 6px; font-size: 12px;">Go</button>
                    </div>
                </div>
                <div style="margin-bottom: 14px; display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="latitude" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Lat</label>
                        <input type="number" step="any" name="latitude" id="latitude" readonly style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; font-size: 13px;">
                    </div>
                    <div style="flex: 1;">
                        <label for="longitude" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Lng</label>
                        <input type="number" step="any" name="longitude" id="longitude" readonly style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; font-size: 13px;">
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 20px;">
                    <button type="button" onclick="document.getElementById('incident-sidebar').style.display='none'" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 500; color: #374151; background: #f3f4f6; border-radius: 6px;">Cancel</button>
                    <button type="submit" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 500; color: white; background: #2563eb; border-radius: 6px;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dispatch Sidebar (docked) -->
    <div id="dispatch-sidebar" style="display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 380px; z-index: 9998; background: white; box-shadow: -4px 0 6px -1px rgba(0,0,0,0.1); overflow-y: auto;">
        <div style="padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 18px; font-weight: 600; color: #111827;">Create Dispatch</h2>
            <button type="button" onclick="document.getElementById('dispatch-sidebar').style.display='none'" style="padding: 4px;">
                <svg style="width: 20px; height: 20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div style="padding: 20px;">
            <form id="dispatch-form" hx-post="/api/dispatch/dispatches/" hx-target="#dispatches-list" hx-swap="innerHTML">
                {% csrf_token %}
                <div style="margin-bottom: 14px;">
                    <label for="dispatch-incident" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Incident</label>
                    <select name="incident" id="dispatch-incident" required style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;"></select>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="dispatch-police" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Police Station</label>
                    <select name="police_station" id="dispatch-police" style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                        <option value="">None</option>
                    </select>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="dispatch-amotekun" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Amotekun Station</label>
                    <select name="amotekun_station" id="dispatch-amotekun" style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                        <option value="">None</option>
                    </select>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="dispatch-status" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Status</label>
                    <select name="status" id="dispatch-status" required style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;">
                        <option value="pending">Pending</option>
                        <option value="dispatched">Dispatched</option>
                        <option value="in_progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div style="margin-bottom: 14px;">
                    <label for="dispatch-notes" style="display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 4px;">Notes</label>
                    <textarea name="notes" id="dispatch-notes" rows="2" style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 20px;">
                    <button type="button" onclick="document.getElementById('dispatch-sidebar').style.display='none'" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 500; color: #374151; background: #f3f4f6; border-radius: 6px;">Cancel</button>
                    <button type="submit" style="flex: 1; padding: 10px; font-size: 14px; font-weight: 500; color: white; background: #16a34a; border-radius: 6px;">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
         integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
         crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/map.js' %}"></script>
    <script src="{% static 'js/data-loader.js' %}"></script>
    <script src="{% static 'js/modals.js' %}"></script>
    <script src="{% static 'js/dropdowns.js' %}"></script>
    <script src="{% static 'js/ui-components.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
