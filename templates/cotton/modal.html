<!-- modal.html -->
<div x-show="show" x-cloak class="fixed inset-0 z-[1100] overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" @click="close"></div>
        <div class="relative inline-block bg-white rounded-2xl text-left overflow-hidden shadow-2xl shadow-slate-900/20 transition-all w-full sm:max-w-lg">
            <div class="px-6 pt-6 pb-4">
                <div class="flex items-start justify-between">
                    <h2 class="text-xl font-semibold text-slate-800" id="modal-title">{{ title }}</h2>
                    <button type="button" class="ml-2 flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition" @click="close">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="border-t border-slate-100 pb-6 px-6">{{ content }}</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('modal' + '{{ unique_id|default:"" }}', () => ({
            open: false,
            openModal() { this.open = true },
            close() { this.open = false }
        }))
    })
</script>
