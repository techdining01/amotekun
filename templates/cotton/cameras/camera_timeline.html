<div class="space-y-4">
    {% for entry in timeline %}
    <div class="flex gap-4">
        <div class="flex flex-col items-center">
            <div class="h-3 w-3 rounded-full shrink-0 mt-1
                {% if entry.event_type == 'alert' %}bg-red-500
                {% elif entry.event_type == 'online' %}bg-emerald-500
                {% elif entry.event_type == 'offline' %}bg-slate-400
                {% else %}bg-blue-500{% endif %}">
            </div>
            {% if not forloop.last %}
            <div class="w-px flex-1 bg-slate-200 mt-1"></div>
            {% endif %}
        </div>
        <div class="pb-4 flex-1 min-w-0">
            <p class="text-sm font-medium text-slate-800">{{ entry.title }}</p>
            <p class="text-xs text-slate-500 mt-0.5">{{ entry.description }}</p>
            <p class="text-xs text-slate-400 mt-1">{{ entry.timestamp|timesince }} ago</p>
        </div>
    </div>
    {% empty %}
    <div class="flex flex-col items-center justify-center py-10 text-center">
        <span class="text-3xl mb-3">📋</span>
        <p class="text-sm text-slate-500">No timeline events recorded.</p>
    </div>
    {% endfor %}
</div>
