<div class="flex items-start gap-3 rounded-xl border border-slate-200 bg-white p-4 hover:shadow-sm transition">
    <div class="flex h-10 w-10 items-center justify-center rounded-lg shrink-0
        {% if detection.label == 'person' %}bg-blue-100 text-blue-600
        {% elif detection.label == 'vehicle' %}bg-slate-100 text-slate-600
        {% elif detection.label == 'weapon' %}bg-red-100 text-red-600
        {% else %}bg-yellow-100 text-yellow-600{% endif %}">
        {% if detection.label == 'person' %}👤
        {% elif detection.label == 'vehicle' %}🚗
        {% elif detection.label == 'weapon' %}⚠️
        {% else %}🔍{% endif %}
    </div>
    <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
            <p class="text-sm font-semibold text-slate-800 capitalize">{{ detection.label }}</p>
            <span class="text-xs font-bold text-slate-500">{{ detection.confidence }}%</span>
        </div>
        <p class="text-xs text-slate-500 mt-0.5">{{ detection.camera.name }}</p>
        <p class="text-xs text-slate-400 mt-1">{{ detection.detected_at|timesince }} ago</p>
    </div>
</div>
