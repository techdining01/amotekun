<div class="grid grid-cols-2 gap-4 sm:grid-cols-4">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 text-center shadow-sm">
        <p class="text-3xl font-bold text-slate-800">{{ stats.total|default:0 }}</p>
        <p class="mt-1 text-xs text-slate-500 uppercase tracking-wide">Total Cameras</p>
    </div>
    <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 text-center shadow-sm">
        <p class="text-3xl font-bold text-emerald-700">{{ stats.online|default:0 }}</p>
        <p class="mt-1 text-xs text-emerald-600 uppercase tracking-wide">Online</p>
    </div>
    <div class="rounded-2xl border border-red-200 bg-red-50 p-5 text-center shadow-sm">
        <p class="text-3xl font-bold text-red-700">{{ stats.offline|default:0 }}</p>
        <p class="mt-1 text-xs text-red-600 uppercase tracking-wide">Offline</p>
    </div>
    <div class="rounded-2xl border border-yellow-200 bg-yellow-50 p-5 text-center shadow-sm">
        <p class="text-3xl font-bold text-yellow-700">{{ stats.alerts|default:0 }}</p>
        <p class="mt-1 text-xs text-yellow-600 uppercase tracking-wide">Active Alerts</p>
    </div>
</div>
