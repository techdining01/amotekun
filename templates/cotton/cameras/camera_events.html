<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        <h3 class="font-semibold text-slate-800">Camera Events</h3>
        <span class="flex items-center gap-1.5 text-xs font-medium text-blue-600">
            <span class="h-2 w-2 rounded-full bg-blue-500 animate-pulse"></span> Live
        </span>
    </div>
    <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
        {% for event in events %}
        <div class="flex items-start gap-3 px-5 py-3 hover:bg-slate-50 transition">
            <span class="mt-1 h-2 w-2 rounded-full shrink-0
                {% if event.severity == 'high' %}bg-red-500
                {% elif event.severity == 'medium' %}bg-yellow-500
                {% else %}bg-blue-500{% endif %}"></span>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-slate-800 truncate">{{ event.title }}</p>
                <p class="text-xs text-slate-500 mt-0.5">{{ event.camera_name }} · {{ event.created_at|timesince }} ago</p>
            </div>
        </div>
        {% empty %}
        <div class="flex flex-col items-center justify-center py-12 text-center">
            <span class="text-3xl mb-3">📷</span>
            <p class="text-sm text-slate-500">No camera events recorded.</p>
        </div>
        {% endfor %}
    </div>
</div>
