<div class="overflow-hidden rounded-2xl border border-slate-200 bg-black shadow-sm">
    {% if snapshot.image %}
    <img src="{{ snapshot.image.url }}" alt="Camera snapshot"
         class="w-full object-cover aspect-video">
    {% else %}
    <div class="flex flex-col items-center justify-center aspect-video text-slate-600">
        <span class="text-4xl mb-3">📷</span>
        <p class="text-sm">No snapshot available</p>
    </div>
    {% endif %}
    <div class="flex items-center justify-between px-4 py-3 bg-slate-900">
        <span class="text-xs text-slate-400">{{ snapshot.camera.name|default:"Unknown Camera" }}</span>
        <span class="text-xs text-slate-500">{{ snapshot.captured_at|date:"M d, Y H:i"|default:"—" }}</span>
    </div>
</div>
