<div class="rounded-2xl border border-indigo-200 bg-gradient-to-br from-indigo-50 to-slate-50 p-5">
    <div class="flex items-center gap-3 mb-4">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white text-sm">🤖</div>
        <h3 class="font-semibold text-slate-800">AI Detection Summary</h3>
    </div>
    <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="rounded-xl bg-white border border-slate-200 p-3 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ detections.persons|default:0 }}</p>
            <p class="text-xs text-slate-500 mt-1">Persons Detected</p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 p-3 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ detections.vehicles|default:0 }}</p>
            <p class="text-xs text-slate-500 mt-1">Vehicles Detected</p>
        </div>
        <div class="rounded-xl bg-white border border-red-200 p-3 text-center">
            <p class="text-2xl font-bold text-red-600">{{ detections.alerts|default:0 }}</p>
            <p class="text-xs text-slate-500 mt-1">Active Alerts</p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 p-3 text-center">
            <p class="text-2xl font-bold text-slate-800">{{ detections.confidence|default:"—" }}</p>
            <p class="text-xs text-slate-500 mt-1">Avg Confidence</p>
        </div>
    </div>
</div>
