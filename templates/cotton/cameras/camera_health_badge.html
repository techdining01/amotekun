{% if camera.health == "good" or camera.is_online %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-700">
    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Healthy
</span>
{% elif camera.health == "degraded" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-yellow-100 px-2.5 py-1 text-xs font-semibold text-yellow-700">
    <span class="h-1.5 w-1.5 rounded-full bg-yellow-500"></span> Degraded
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-700">
    <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span> Fault
</span>
{% endif %}
