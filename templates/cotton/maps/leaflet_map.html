{% load static %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

<div id="{{ map_id|default:'leaflet-map' }}"
     class="{{ class|default:'h-[500px] w-full' }} rounded-xl overflow-hidden border border-slate-200">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script>
(function() {
    const mapId = '{{ map_id|default:"leaflet-map" }}';
    const lat = {{ center_lat|default:"7.5" }};
    const lng = {{ center_lng|default:"4.5" }};
    const zoom = {{ zoom|default:"7" }};
    const tile = '{{ tile|default:"dark" }}';

    const tileUrls = {
        dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        osm: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    };

    const m = L.map(mapId, { zoomControl: true }).setView([lat, lng], zoom);
    L.tileLayer(tileUrls[tile] || tileUrls.dark, { maxZoom: 19 }).addTo(m);
    window['map_' + mapId] = m;
})();
</script>
