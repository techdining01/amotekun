<div class="flex flex-wrap items-center gap-2 rounded-xl border border-slate-200 bg-white/90 backdrop-blur px-3 py-2 shadow-lg">
    {% if show_layers %}
    <button class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition"
            hx-get="{{ layers_url }}" hx-target="#layer-panel" hx-swap="innerHTML">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
        </svg>
        Layers
    </button>
    {% endif %}
    {% if show_heatmap %}
    <button class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition"
            onclick="toggleHeatmap()">
        🔥 Heatmap
    </button>
    {% endif %}
    {% if show_incidents %}
    <button class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition"
            onclick="toggleIncidents()">
        🚨 Incidents
    </button>
    {% endif %}
    {% if show_patrols %}
    <button class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 transition"
            onclick="togglePatrols()">
        🛡 Patrols
    </button>
    {% endif %}
    <div class="ml-auto flex items-center gap-1.5 text-xs text-slate-400">
        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Live
    </div>
</div>
