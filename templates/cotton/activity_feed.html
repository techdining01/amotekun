<div class="space-y-4">
    {% for activity in activities %}
    <div class="flex items-start space-x-4">
        <div class="flex-shrink-0">
            <div class="h-8 w-8 rounded-full bg-{{ activity.color|default:'blue' }}-100 flex items-center justify-center">
                <span class="text-{{ activity.color|default:'blue' }}-600 text-bold">{{ activity.icon|default:'!' }}</span>
            </div>
        </div>
        <div class="flex-1">
            <h3 class="text-sm font-medium text-gray-900">{{ activity.title }}</h3>
            <p class="text-sm text-gray-500 truncate">{{ activity.description }}</p>
            <p class="text-xs text-gray-400">{{ activity.timestamp|timesince }} ago</p>
        </div>
    </div>
    {% empty %}
    <p class="text-center text-gray-500 py-8">No recent activity.</p>
    {% endfor %}
</div>
