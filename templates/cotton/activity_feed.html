<div class="space-y-4">
    {% for activity in activities %}
    <div class="flex items-start gap-4">
        <div class="shrink-0">
            <div class="h-8 w-8 rounded-full bg-{{ activity.color|default:'blue' }}-100 flex items-center justify-center">
                <span class="text-{{ activity.color|default:'blue' }}-600 font-bold text-sm">{{ activity.icon|default:'!' }}</span>
            </div>
        </div>
        <div class="flex-1 min-w-0">
            <h3 class="text-sm font-medium text-slate-800">{{ activity.title }}</h3>
            <p class="text-sm text-slate-500 truncate">{{ activity.description }}</p>
            <p class="text-xs text-slate-400 mt-0.5">{{ activity.timestamp|timesince }} ago</p>
        </div>
    </div>
    {% empty %}
    <p class="text-center text-slate-400 py-8 text-sm">No recent activity.</p>
    {% endfor %}
</div>
