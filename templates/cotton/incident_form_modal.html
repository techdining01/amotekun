<form method="post" action="{% url 'incident-create' %}">
    {% csrf_token %}
    <h3 class="text-lg font-medium text-gray-900 mb-4">Report New Incident</h3>
    <div class="mb-4">
        <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input type="text" name="title" id="title" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea name="description" id="description" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div class="mb-4">
        <label for="report_type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
        <select name="report_type" id="report_type" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="crime">Crime</option>
            <option value="violence">Violence</option>
            <option value="fire">Fire</option>
            <option value="flood">Flood</option>
            <option value="accident">Accident</option>
        </select>
    </div>
</form>
