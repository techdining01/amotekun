<div class="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md transition">
    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-600 text-white font-bold text-lg shrink-0">
        {{ officer.get_full_name|first|upper|default:"O" }}
    </div>
    <div class="flex-1 min-w-0">
        <p class="font-semibold text-slate-800 truncate">{{ officer.get_full_name|default:officer.username }}</p>
        <p class="text-xs text-slate-500 mt-0.5">{{ officer.role|title }}</p>
    </div>
    <div class="shrink-0">
        {% if officer.is_online %}
        <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-700">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
        </span>
        {% else %}
        <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-500">
            <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span> Offline
        </span>
        {% endif %}
    </div>
</div>
