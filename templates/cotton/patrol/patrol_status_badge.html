{% if patrol.status == "ON_PATROL" or patrol.status == "active" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
    <span class="h-1.5 w-1.5 rounded-full bg-green-500 animate-pulse"></span> On Patrol
</span>
{% elif patrol.status == "DISPATCHED" or patrol.status == "responding" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">
    <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span> Responding
</span>
{% elif patrol.status == "AVAILABLE" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700">
    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span> Available
</span>
{% elif patrol.status == "MAINTENANCE" %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-yellow-100 px-3 py-1 text-xs font-semibold text-yellow-700">
    <span class="h-1.5 w-1.5 rounded-full bg-yellow-500"></span> Maintenance
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">
    <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span> Offline
</span>
{% endif %}
