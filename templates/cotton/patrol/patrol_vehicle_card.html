<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm hover:shadow-md transition">
    <div class="flex items-start justify-between gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-100 text-2xl shrink-0">
            🚓
        </div>
        <div class="flex-1 min-w-0">
            <p class="font-semibold text-slate-800 truncate">{{ vehicle.registration_number }}</p>
            <p class="text-xs text-slate-500 mt-0.5">{{ vehicle.make }} {{ vehicle.model }} · {{ vehicle.year }}</p>
        </div>
        <span class="rounded-full px-2.5 py-1 text-xs font-semibold shrink-0
            {% if vehicle.status == 'AVAILABLE' %}bg-emerald-100 text-emerald-700
            {% elif vehicle.status == 'ON_PATROL' %}bg-blue-100 text-blue-700
            {% elif vehicle.status == 'MAINTENANCE' %}bg-yellow-100 text-yellow-700
            {% else %}bg-red-100 text-red-700{% endif %}">
            {{ vehicle.status|title }}
        </span>
    </div>
    <div class="mt-4 grid grid-cols-2 gap-3 text-xs text-slate-500">
        <div>
            <span class="uppercase tracking-wide text-slate-400">Fuel</span>
            <p class="font-medium text-slate-700 mt-0.5">{{ vehicle.fuel_type|title }}</p>
        </div>
        <div>
            <span class="uppercase tracking-wide text-slate-400">Agency</span>
            <p class="font-medium text-slate-700 mt-0.5 truncate">{{ vehicle.agency.name }}</p>
        </div>
    </div>
</div>
