<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

    <div class="flex items-start justify-between">

        <div>

            <h3 class="text-lg font-semibold">{{ patrol.name }}</h3>

            <p class="mt-1 text-sm text-slate-500">{{ patrol.team }}</p>

        </div>

        {% include "cotton/patrol/patrol_status_badge.html" %}

    </div>

    <div class="mt-6 grid grid-cols-2 gap-4">

        <div>
            <p class="text-xs uppercase text-slate-400">Vehicle</p>
            <p class="font-medium">{{ patrol.vehicle }}</p>
        </div>

        <div>
            <p class="text-xs uppercase text-slate-400">Officers</p>
            <p class="font-medium">{{ patrol.officer_count }}</p>
        </div>

    </div>

</div>
