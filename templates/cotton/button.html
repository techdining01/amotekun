<button 
    type="{{ type|default:'button' }}" 
    :disabled="isSubmitting"
    class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold text-white bg-sky-600 hover:bg-sky-500 active:scale-[0.99] transition-all disabled:opacity-50 disabled:pointer-events-none {{ class }}"
>
    <template x-if="!isSubmitting">
        <span>{{ slot }}</span>
    </template>
    <template x-if="isSubmitting">
        <span class="flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing...
        </span>
    </template>
</button>
