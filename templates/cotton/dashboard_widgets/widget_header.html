<div class="flex items-center justify-between px-6 py-4 border-b border-slate-100/80 bg-slate-50/30">

    <div>

        {% if title %}
            <h2 class="text-base font-bold text-slate-800 tracking-tight">
                {{ title }}
            </h2>
        {% endif %}

        {% if subtitle %}
            <p class="mt-0.5 text-xs text-slate-500 font-medium">
                {{ subtitle }}
            </p>
        {% endif %}

    </div>

    <div class="flex items-center gap-1.5">

        {% if toolbar %}
            {{ toolbar }}
        {% endif %}

        {% if actions %}
            {% include "cotton/dashboard_widgets/widget_actions.html" %}
        {% endif %}

    </div>

</div>
