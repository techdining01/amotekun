<div class="flex items-center gap-2">

    {{ actions }}

    {% if refresh_url %}

        <button
            type="button"
            class="inline-flex items-center rounded-lg border border-slate-200 bg-white p-2 hover:bg-slate-100 transition"
            hx-get="{{ refresh_url }}"
            hx-target="closest .group"
            hx-swap="outerHTML">

            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 4v6h6M20 20v-6h-6M20 8A8 8 0 005.3 5.3L4 10m16 4l-1.3 4.7A8 8 0 014 16">
                </path>

            </svg>

        </button>

    {% endif %}

</div>
