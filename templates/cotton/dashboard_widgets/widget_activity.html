<div class="space-y-4">

    {% for item in activities %}

        <div class="flex gap-4">

            <div class="mt-1 h-3 w-3 rounded-full bg-blue-600 shrink-0"></div>

            <div class="flex-1">

                <div class="font-medium text-slate-800">

                    {{ item.title }}

                </div>

                <div class="mt-1 text-sm text-slate-500">

                    {{ item.description }}

                </div>

                <div class="mt-2 text-xs text-slate-400">

                    {{ item.time }}

                </div>

            </div>

        </div>

    {% empty %}

        {% include "cotton/dashboard_widgets/widget_empty.html" with empty_title="No Activity" empty_message="Recent activities will appear here." %}

    {% endfor %}

</div>
