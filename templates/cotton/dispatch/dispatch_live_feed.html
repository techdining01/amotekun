<div
class="space-y-4"
hx-get="{{ live_url }}"
hx-trigger="load,every 5s"
hx-target="this"
hx-swap="innerHTML">

{% for event in events %}

<div class="flex gap-4">

<div class="mt-2 h-3 w-3 rounded-full bg-blue-600 animate-pulse"></div>

<div>

<div class="font-medium">

{{ event.title }}

</div>

<div class="text-sm text-slate-500">

{{ event.description }}

</div>

<div class="text-xs text-slate-400">

{{ event.created_at|timesince }} ago

</div>

</div>

</div>

{% endfor %}

</div>
