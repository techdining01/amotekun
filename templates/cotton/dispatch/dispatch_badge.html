{% if dispatch.priority == "critical" %}
<span class="inline-flex items-center gap-1 rounded-full bg-red-600 px-2.5 py-0.5 text-xs font-bold text-white">
    🔴 Critical
</span>
{% elif dispatch.priority == "high" %}
<span class="inline-flex items-center gap-1 rounded-full bg-orange-500 px-2.5 py-0.5 text-xs font-bold text-white">
    🟠 High
</span>
{% elif dispatch.priority == "medium" %}
<span class="inline-flex items-center gap-1 rounded-full bg-yellow-400 px-2.5 py-0.5 text-xs font-bold text-slate-900">
    🟡 Medium
</span>
{% else %}
<span class="inline-flex items-center gap-1 rounded-full bg-slate-200 px-2.5 py-0.5 text-xs font-semibold text-slate-700">
    Low
</span>
{% endif %}
