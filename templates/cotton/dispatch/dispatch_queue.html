<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
     hx-get="{{ refresh_url }}"
     hx-trigger="load,every 10s"
     hx-target="this"
     hx-swap="innerHTML">

    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/30">

        <h3 class="font-semibold text-slate-800">Active Dispatches</h3>

        <span class="flex items-center gap-1.5 text-xs font-medium text-slate-500">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live
        </span>

    </div>

    <div class="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">

        {% for dispatch in dispatches %}

        {% include "cotton/dispatch/dispatch_card.html" %}

        {% empty %}

        <div class="flex flex-col items-center justify-center py-12 text-center">
            <span class="text-3xl mb-3">✅</span>
            <p class="text-sm text-slate-500">No active dispatches.</p>
        </div>

        {% endfor %}

    </div>

</div>
