<form
hx-post="{{ action }}"
hx-target="{{ target }}"
hx-swap="outerHTML"
class="space-y-6">

{% csrf_token %}

{{ form }}

<div class="flex justify-end gap-3">

<button
type="button"
class="rounded-xl border px-5 py-2"
@click="close()">

Cancel

</button>

<button
class="rounded-xl bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">

Assign Unit

</button>

</div>

</form>
