<!-- field.html -->
<div class="space-y-1.5">
    {% if label %}
        <label for="{{ id }}" class="block text-sm font-medium text-slate-200">
            {{ label }}
        </label>
    {% endif %}

    <div class="relative rounded-2xl border border-slate-700 bg-slate-950/80 px-4 py-3.5
                focus-within:border-sky-500 focus-within:ring-1 focus-within:ring-sky-500
                transition-all duration-200
                [&>input]:w-full [&>input]:bg-transparent [&>input]:border-0 [&>input]:p-0
                [&>input]:text-white [&>input]:placeholder-slate-500 [&>input]:focus:outline-none [&>input]:focus:ring-0
                [&>select]:w-full [&>select]:bg-slate-900 [&>select]:border-0 [&>select]:p-0
                [&>select]:text-white [&>select]:focus:outline-none [&>select]:focus:ring-0
                [&>select>option]:bg-slate-900 [&>select>option]:text-white
                [&>textarea]:w-full [&>textarea]:bg-transparent [&>textarea]:border-0 [&>textarea]:p-0
                [&>textarea]:text-white [&>textarea]:placeholder-slate-500 [&>textarea]:focus:outline-none [&>textarea]:focus:ring-0">
        {{ slot }}
    </div>

    {% if errors %}
        <p class="text-sm text-rose-400 font-medium flex items-center gap-1.5 mt-1">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ errors }}
        </p>
    {% endif %}
</div>
