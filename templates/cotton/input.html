<div class="mb-4">
    <label for="{{ id }}" class="block text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    {% if type == 'select' %}
        <select id="{{ id }}" name="{{ name }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 {% if class %}{{ class }}{% endif %}" {% if required %}required{% endif %}>
            {% for option in options %}
                <option value="{{ option.value }}" {% if option.value == value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
        </select>
    {% elif type == 'textarea' %}
        <textarea id="{{ id }}" name="{{ name }}" rows="{{ rows|default:3 }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 {% if class %}{{ class }}{% endif %}" {% if required %}required{% endif %}>{{ value }}</textarea>
    {% else %}
        <input type="{{ type|default:'text' }}" id="{{ id }}" name="{{ name }}" value="{{ value|default:'' }}" placeholder="{{ placeholder|default:'' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 {% if class %}{{ class }}{% endif %}" {% if required %}required{% endif %}>
    {% endif %}
    {% if help_text %}
        <p class="mt-1 text-sm text-gray-500">{{ help_text }}</p>
    {% endif %}
    {% if errors %}
        <p class="mt-1 text-sm text-red-500">{{ errors }}</p>
    {% endif %}
</div>
