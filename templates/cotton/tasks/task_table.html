<div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="p-6">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-semibold">My Tasks</h3>
            <span class="text-sm text-slate-500">{{ tasks|length }} active</span>
        </div>
        
        {% for task in tasks %}
        <div class="flex items-start gap-4 py-4 border-b border-slate-100 last:border-0">
            <div class="mt-1 h-5 w-5 rounded-full border-2 flex items-center justify-center shrink-0
                         {% if task.completed %}bg-green-500 border-green-500{% else %}border-slate-300{% endif %}">
                {% if task.completed %}
                <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                </svg>
                {% endif %}
            </div>
            <div class="flex-1">
                <div class="font-medium text-slate-800 {% if task.completed %}line-through text-slate-400{% endif %}">
                    {{ task.title }}
                </div>
                <div class="mt-1 text-sm text-slate-500">
                    {{ task.description }}
                </div>
                <div class="mt-2 flex items-center gap-2">
                    <span class="text-xs px-2 py-1 rounded-full
                                 {% if task.priority == 'high' %}bg-red-100 text-red-700{% elif task.priority == 'medium' %}bg-yellow-100 text-yellow-700{% else %}bg-slate-100 text-slate-700{% endif %}">
                        {{ task.priority|title }}
                    </span>
                    <span class="text-xs text-slate-400">
                        {{ task.due_date|date:"M d" }}
                    </span>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-8 text-slate-400">
            <div class="text-4xl mb-2">📋</div>
            <p>No active tasks</p>
        </div>
        {% endfor %}
    </div>
</div>
