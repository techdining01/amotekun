<style>
.nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 500; color: #475569;
    text-decoration: none; transition: background .15s, color .15s;
    margin-bottom: 2px; white-space: nowrap; overflow: hidden;
}
.nav-link:hover { background: #f1f5f9; color: #1e293b; }
.nav-link.active { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
.nav-link .nav-icon { flex-shrink: 0; width: 18px; text-align: center; }
.nav-link .nav-label { transition: opacity .2s; }
.nav-section {
    font-size: 10px; font-weight: 700; color: #94a3b8;
    text-transform: uppercase; letter-spacing: .08em;
    padding: 10px 10px 3px; white-space: nowrap; overflow: hidden;
}
[x-data] [x-show="sidebarCollapsed"] .nav-section { opacity: 0; height: 0; padding: 0; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var path = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function (a) {
        var href = a.getAttribute('href');
        if (href && href !== '/' && path.startsWith(href)) {
            a.classList.add('active');
        }
    });
});
</script>
