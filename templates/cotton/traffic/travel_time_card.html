<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-slate-800">Travel Times</h3>
        <span class="text-xl">⏱</span>
    </div>
    <div class="space-y-3">
        {% for route in routes %}
        <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
            <div>
                <p class="text-sm font-medium text-slate-800">{{ route.name }}</p>
                <p class="text-xs text-slate-500">{{ route.start }} → {{ route.end }}</p>
            </div>
            <span class="rounded-full px-3 py-1 text-xs font-bold
                {% if route.congestion == 'heavy' %}bg-red-100 text-red-700
                {% elif route.congestion == 'moderate' %}bg-yellow-100 text-yellow-700
                {% else %}bg-green-100 text-green-700{% endif %}">
                {{ route.travel_time }}
            </span>
        </div>
        {% empty %}
        <p class="text-sm text-slate-400 text-center py-4">No route data available.</p>
        {% endfor %}
    </div>
</div>
