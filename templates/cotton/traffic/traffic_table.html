<div class="overflow-hidden rounded-2xl border border-slate-200">

<table class="min-w-full">

<thead class="bg-slate-50">

<tr>

<th class="px-6 py-4 text-left">

Road

</th>

<th class="px-6 py-4 text-left">

Speed

</th>

<th class="px-6 py-4 text-left">

Congestion

</th>

<th class="px-6 py-4 text-left">

Updated

</th>

</tr>

</thead>

<tbody class="divide-y divide-slate-100">

{% for road in roads %}

<tr>

<td class="px-6 py-4">

{{ road.name }}

</td>

<td class="px-6 py-4">

{{ road.speed }}

</td>

<td class="px-6 py-4">

{{ road.level }}

</td>

<td class="px-6 py-4">

{{ road.updated }}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>
