<div class="overflow-hidden rounded-2xl border border-red-200 bg-gradient-to-br from-red-50 to-orange-50 shadow-sm">

    <div class="flex items-center justify-between px-6 py-4 border-b border-red-100">

        <div class="flex items-center gap-2">

            <span class="text-lg">🚨</span>

            <h3 class="font-semibold text-slate-800">Critical Alerts</h3>

        </div>

        <span class="flex items-center gap-1.5 rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">

            <span class="h-1.5 w-1.5 rounded-full bg-red-500 animate-pulse"></span>

            {{ alerts|length }} Active

        </span>

    </div>

    <div class="p-5 space-y-3 max-h-[400px] overflow-y-auto">

        {% for alert in alerts %}

        <div class="flex items-start gap-3 rounded-xl bg-white/80 border border-red-100 p-4 hover:shadow-sm transition">

            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-red-100 text-red-600 shrink-0 mt-0.5">

                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>

            </div>

            <div class="flex-1 min-w-0">

                <p class="text-sm font-semibold text-slate-800">{{ alert.title }}</p>

                <p class="text-xs text-slate-500 mt-0.5">{{ alert.message }}</p>

                <p class="text-xs text-slate-400 mt-1">{{ alert.created_at|timesince }} ago</p>

            </div>

        </div>

        {% empty %}

        <div class="text-center py-8">
            <span class="text-3xl mb-2 block">✅</span>
            <p class="text-sm text-slate-500">No critical alerts at this time.</p>
        </div>

        {% endfor %}

    </div>

</div>
