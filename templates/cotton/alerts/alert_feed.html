<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/30">
        <div class="flex items-center gap-2">
            <span class="flex h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
            <h3 class="font-semibold text-slate-800">Security Alerts</h3>
        </div>
        <span class="text-xs font-medium text-slate-500">
            Live Updates
        </span>
    </div>
    <div class="divide-y divide-slate-100 max-h-96 overflow-y-auto">
        {% for alert in alerts %}
            {% include "cotton/alerts/alert_item.html" %}
        {% empty %}
            {% include "cotton/alerts/alert_empty.html" %}
        {% endfor %}
    </div>
</div>
