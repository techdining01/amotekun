<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-slate-800">Rainfall</h3>
        <span class="text-2xl">🌧</span>
    </div>
    <div class="space-y-3">
        {% for entry in rainfall %}
        <div class="flex items-center gap-3">
            <span class="w-16 text-xs text-slate-500 shrink-0">{{ entry.day }}</span>
            <div class="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full rounded-full bg-blue-500 transition-all duration-500"
                     style="width:{{ entry.percent }}%"></div>
            </div>
            <span class="w-12 text-right text-xs font-semibold text-slate-700">{{ entry.mm }}mm</span>
        </div>
        {% empty %}
        <p class="text-sm text-slate-400 text-center py-4">No rainfall data available.</p>
        {% endfor %}
    </div>
</div>
