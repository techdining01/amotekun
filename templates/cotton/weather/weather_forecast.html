<div class="grid gap-4 md:grid-cols-5">

{% for day in forecast %}

<div class="rounded-xl border border-slate-200 bg-white p-5 text-center">

<p class="font-medium">

{{ day.day }}

</p>

<img
src="{{ day.icon }}"
class="mx-auto my-4 h-12 w-12">

<p class="text-2xl font-bold">

{{ day.temp }}°

</p>

<p class="mt-2 text-sm text-slate-500">

{{ day.condition }}

</p>

</div>

{% endfor %}

</div>
