<div class="absolute right-0 mt-3 w-96 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl z-50"
     x-show="open" @click.outside="open=false"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 scale-95 translate-y-1"
     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0 scale-95">

    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <h3 class="font-semibold text-slate-800">Notifications</h3>
        <button class="text-xs font-medium text-sky-600 hover:text-sky-500 transition"
                hx-post="{% url 'notification-list' %}"
                hx-target="#notification-list"
                hx-swap="innerHTML">
            Mark all read
        </button>
    </div>

    <div id="notification-list"
         class="max-h-[420px] overflow-y-auto divide-y divide-slate-100"
         hx-get="{% url 'notification-list' %}"
         hx-trigger="load, every 20s"
         hx-swap="innerHTML">
        <div class="flex items-center justify-center py-10 text-slate-400 text-sm">
            Loading notifications...
        </div>
    </div>

    <div class="border-t border-slate-100 px-5 py-3 text-center">
        <a href="#" class="text-xs font-medium text-sky-600 hover:text-sky-500 transition">
            View all notifications →
        </a>
    </div>
</div>
