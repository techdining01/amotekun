<div x-data="{ show: true }" x-show="show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-2 scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0 scale-95"
     x-init="setTimeout(() => show = false, 5000)"
     class="pointer-events-auto flex items-start gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3 shadow-xl w-96">
    <div class="mt-0.5 h-8 w-8 rounded-full flex items-center justify-center shrink-0
        {% if type == 'error' %}bg-red-100 text-red-600
        {% elif type == 'success' %}bg-emerald-100 text-emerald-600
        {% elif type == 'warning' %}bg-yellow-100 text-yellow-600
        {% else %}bg-sky-100 text-sky-600{% endif %}">
        {% if type == 'error' %}⚠️{% elif type == 'success' %}✅{% elif type == 'warning' %}⚡{% else %}🔔{% endif %}
    </div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-800">{{ title }}</p>
        <p class="text-xs text-slate-500 mt-0.5">{{ message }}</p>
    </div>
    <button @click="show = false" class="text-slate-400 hover:text-slate-600 transition mt-0.5">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>
</div>
