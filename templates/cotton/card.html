<div class="border rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200">
        {{ header }}
        {% cotton:slot header %}
        {% endcotton:slot %}
    </div>
    <div class="px-6 pt-4 pb-6">
        {{ body }}
        {% cotton:slot body %}
        {% endcotton:slot %}
    </div>
    <div class="px-6 py-4 border-t">
        {{ footer }}
        {% cotton:slot footer %}
        {% endcotton:slot %}
    </div>
</div>
