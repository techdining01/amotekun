<div class="alert alert-{{ variant }} mb-4 p-4 rounded-lg {{ class }}">
    <div class="flex">
        <div class="flex-shrink-0">
            {% if variant == 'success' %}
                <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
            {% elif variant == 'error' %}
                <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0 1 1 0 001.414-1.414l2-2a1 1 0 00-1.414-1.414z" clip-rule="evenodd" />
                </svg>
            {% elif variant == 'warning' %}
                <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.581 9.909c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.492-1.646-1.742-2.98l5.581-9.909zM11 13a1 1 0 100-2 1 1 0 000 2zM11 7a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                </svg>
            {% elif variant == 'info' %}
                <svg class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0 1 1 0 001.414-1.414l2-2a1 1 0 00-1.414-1.414z" clip-rule="evenodd" />
                </svg>
            {% endif %}
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium text-{{ variant }}-800">{{ title }}</p>
            <p class="mt-1 text-sm text-{{ variant }}-700">{{ message }}</p>
        </div>
    </div>
</div>
