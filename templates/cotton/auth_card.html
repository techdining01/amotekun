<div class="w-full max-w-md mx-auto">
    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-slate-950/50">
        {% if title %}
            <div class="text-center mb-8">
                <h3 class="text-2xl font-bold text-white tracking-tight">{{ title }}</h3>
                {% if subtitle %}
                    <p class="text-slate-400 mt-2 text-sm leading-relaxed">{{ subtitle }}</p>
                {% endif %}
            </div>
        {% endif %}
        
        <div class="space-y-6">
            {{ slot }}
        </div>
    </div>
</div>
