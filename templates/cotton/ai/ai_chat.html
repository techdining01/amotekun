<div class="rounded-2xl border border-slate-200 bg-white">

<div class="border-b border-slate-200 p-4 font-semibold">

AI Assistant

</div>

<div
id="ai-chat-messages"
class="h-[500px] overflow-y-auto p-5 space-y-4">

{{ messages }}

</div>

<form
hx-post="{{ chat_url }}"
hx-target="#ai-chat-messages"
hx-swap="beforeend"
class="border-t border-slate-200 p-4">

<div class="flex gap-3">

<input
type="text"
name="message"
placeholder="Ask the AI..."
class="flex-1 rounded-xl border border-slate-300 px-4 py-3">

<button
class="rounded-xl bg-blue-600 px-6 py-3 text-white">

Send

</button>

</div>

</form>

</div>
