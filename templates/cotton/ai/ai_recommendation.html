<div class="rounded-2xl border border-indigo-200 bg-gradient-to-br from-indigo-50 to-purple-50 p-6">
    <div class="flex items-center gap-3 mb-5">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white text-lg">💡</div>
        <h3 class="text-lg font-semibold text-slate-800">AI Recommendations</h3>
    </div>
    <div class="space-y-3">
        {% for rec in recommendations %}
        <div class="flex items-start gap-3 rounded-xl bg-white/70 border border-indigo-100 p-4">
            <span class="mt-0.5 flex h-6 w-6 items-center justify-center rounded-full text-xs font-bold
                {% if rec.priority == 'high' %}bg-red-100 text-red-700
                {% elif rec.priority == 'medium' %}bg-yellow-100 text-yellow-700
                {% else %}bg-emerald-100 text-emerald-700{% endif %}">
                {{ forloop.counter }}
            </span>
            <div class="flex-1">
                <p class="text-sm font-semibold text-slate-800">{{ rec.title }}</p>
                <p class="text-xs text-slate-500 mt-0.5">{{ rec.description }}</p>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-8 text-slate-400 text-sm">
            No recommendations at this time.
        </div>
        {% endfor %}
    </div>
</div>
