<div class="rounded-2xl border border-orange-200 bg-gradient-to-br from-orange-50 to-red-50 p-5 shadow-sm">
    <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-lg">🔥</span>
                <span class="text-xs font-semibold uppercase tracking-wide text-orange-600">
                    {{ hotspot.hotspot_type|title }} Hotspot
                </span>
            </div>
            <p class="text-sm text-slate-700">
                {{ hotspot.lga|default:"Unknown LGA" }}, {{ hotspot.state|default:"Unknown State" }}
            </p>
            <p class="text-xs text-slate-500 mt-1">{{ hotspot.incident_count }} incidents · {{ hotspot.calculated_at|timesince }} ago</p>
        </div>
        <div class="shrink-0 text-right">
            <p class="text-2xl font-bold text-orange-600">{{ hotspot.intensity_score|floatformat:0 }}%</p>
            <p class="text-xs text-slate-500">Intensity</p>
        </div>
    </div>
    <div class="mt-4 h-2 rounded-full bg-orange-100 overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-r from-yellow-400 to-red-500 transition-all duration-700"
             style="width:{{ hotspot.intensity_score }}%"></div>
    </div>
</div>
