{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Amotekun{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200 overflow-x-hidden">
    <!-- Background Ambient Glows -->
    <div class="fixed inset-0 -z-20">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-sky-500/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 translate-x-1/3 translate-y-1/3 w-80 h-80 bg-indigo-500/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Noise Overlay -->
    <div class="fixed inset-0 -z-10 opacity-30 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 400 400\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');"></div>

    <div class="min-h-screen flex flex-col justify-center px-4 py-12 sm:px-6 lg:px-8">
        <!-- Header with Logo -->
        <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-8">
            <a href="{% url 'home' %}" class="inline-flex items-center gap-2 text-lg font-bold tracking-widest uppercase text-sky-400 hover:text-sky-300 transition-colors">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                Amotekun
            </a>
            <h2 class="text-2xl font-bold tracking-tight text-white mt-4">
                {% block heading %}{% endblock %}
            </h2>
            {% if subheading %}
                <p class="text-slate-400 mt-2 text-sm">
                    {{ subheading }}
                </p>
            {% endif %}
        </div>

        <!-- Main Content -->
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <p class="mt-12 text-center text-xs tracking-wide text-slate-600 uppercase">
            South West Nigeria Security Network
        </p>
    </div>
</body>
</html>
