{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Amotekun{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script defer src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

    <div class="flex min-h-screen flex-col justify-center px-4 py-12 sm:px-6 lg:px-8 relative isolate">
        <!-- Minimal subtle glow -->
        <div class="absolute inset-x-0 top-0 -z-10 flex transform-gpu justify-center overflow-hidden blur-3xl" aria-hidden="true">
            <div class="aspect-[1155/678] w-[72.1875rem] bg-gradient-to-tr from-sky-500 to-indigo-600 opacity-5 sm:w-[30rem]"></div>
        </div>

        <div class="sm:mx-auto sm:w-full sm:max-w-md text-center space-y-2">
            <a href="{% url 'home' %}" class="inline-block text-lg font-bold tracking-[0.4em] uppercase text-sky-500 hover:text-sky-400 transition-colors">
                Amotekun
            </a>
            <h2 class="text-xl font-medium tracking-tight text-slate-200">
                {% block heading %}{% endblock %}
            </h2>
        </div>

        <div class="mt-8 sm:mx-auto sm:max-w-md">
            <div class="bg-slate-900/40 border border-slate-900 backdrop-blur-md rounded-2xl p-6 sm:p-8 shadow-2xl">
                {% block content %}{% endblock %}
            </div>
            
            <p class="mt-8 text-center text-xs tracking-wide text-slate-600 uppercase">
                South West Nigeria Security Network
            </p>
        </div>
    </div>

</body>
</html>
