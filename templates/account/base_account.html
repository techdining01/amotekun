{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Amotekun | Account{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="relative isolate flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 opacity-90"></div>
        <div class="relative w-full max-w-md space-y-8">
            <div class="text-center">
                <a href="{% url 'home' %}" class="inline-flex items-center text-sm font-semibold uppercase tracking-[0.24em] text-sky-600 hover:text-sky-300">
                    Amotekun
                </a>
                <h1 class="mt-4 text-3xl font-semibold tracking-tight text-white">{% block heading %}Secure access{% endblock %}</h1>
                <p class="mt-2 text-sm text-slate-400">{% block subheading %}for municipals{% endblock %}</p>
            </div>

            <div id="auth-card" class="rounded-3xl border border-white/10 bg-slate-900/95 shadow-2xl shadow-slate-950/40 backdrop-blur-sm">
                {% block content %}{% endblock %}
            </div>

            <p class="text-center text-sm text-slate-500">South West Nigeria Security Network</p>
        </div>
    </div>
</body>
</html>
