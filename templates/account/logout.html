{% extends "dashboard/base_dashboard.html" %}
{% block content %}
<div class="max-w-md mx-auto">
    {% cotton card %}
        {% cotton:slot "header" %}
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Logged Out</h2>
        {% endcotton:slot %}
        {% cotton:slot "body" %}
            <p class="text-center text-gray-600 mb-4">You have been successfully logged out.</p>
            <div class="flex justify-center">
                <a href="{% url 'account_login' %}" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md">
                    Log In Again
                </a>
            </div>
        {% endcotton:slot %}
    {% endcotton %}
</div>
{% endblock %}
