{% load static %}
<div id="{{ widget.name }}-map" style="width: 100%; height: 400px; border: 1px solid #ccc; margin-bottom: 10px;"></div>
<input type="hidden" name="{{ widget.name }}" id="{{ widget.name }}" value="{{ widget.value }}" />

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>
(function() {
    var mapDiv = document.getElementById('{{ widget.name }}-map');
    if (!mapDiv) return;
    
    var map = L.map(mapDiv).setView([9.082, 8.675], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
    
    var marker = null;
    
    // Load existing value
    var input = document.getElementById('{{ widget.name }}');
    if (input && input.value) {
        try {
            var data = JSON.parse(input.value);
            if (data.type === 'Point' && data.coordinates) {
                var latlng = [data.coordinates[1], data.coordinates[0]];
                map.setView(latlng, 14);
                marker = L.marker(latlng).addTo(map);
            }
        } catch(e) {}
    }
    
    map.on('click', function(e) {
        if (marker) map.removeLayer(marker);
        marker = L.marker(e.latlng).addTo(map);
        
        var geojson = {
            type: 'Point',
            coordinates: [e.latlng.lng, e.latlng.lat]
        };
        input.value = JSON.stringify(geojson);
    });
})();
</script>
